// ─── TIMELINE GENERATION ────────────────────────────────────────────────

function calcItemOffsets(steps) {
  let activeClock = 0;
  let bgClock = 0;
  const result = [];
  for (const step of steps) {
    let start = activeClock;
    if (step.waitBg) start = Math.max(start, bgClock);
    const end = start + step.dur;
    result.push({ ...step, calcStart: start, calcEnd: end });
    if (step.bg) { bgClock = Math.max(bgClock, end); }
    else { activeClock = end; }
  }
  return result;
}

function generateTimeline(selectedIds, itemWeights, servingTimeMs, allItems) {
  const dessertPrepEvents = [];
  const mainEvents = [];
  const postServeEvents = [];
  let hasPostServe = false;

  for (const id of selectedIds) {
    let src = allItems[id];
    if (!src) continue;
    const weightKg = (src.weightBased ? (itemWeights[id] || 1500) : 1500) / 1000;
    const allSteps = src.steps.map((s, i) => ({
      ...s, _origIdx: i,
      dur: s.dur + (src.weightBased && s.perKg ? Math.round(s.perKg * weightKg) : 0),
    }));
    const meta = { id, name: src.name, icon: src.icon, colour: src.colour };
    const preSteps = allSteps.filter(s => !s.afterServe);
    const postSteps = allSteps.filter(s => s.afterServe);
    const isDessertItem = postSteps.length > 0;

    // Pre-serve steps
    if (preSteps.length > 0) {
      const offsets = calcItemOffsets(preSteps);
      const totalTime = Math.max(...offsets.map(s => s.calcEnd));
      const events = offsets.map(step => ({
        id: `${meta.id}_${step._origIdx}`, ...meta,
        stepName: step.name, note: step.note, type: step.type,
        autoPause: step.auto, isBg: !!step.bg, temp: step.temp,
        offsetStart: step.calcStart - totalTime, offsetEnd: step.calcEnd - totalTime,
        durMins: step.dur,
      }));
      // Dessert items go in a separate prep phase before main cooking
      if (isDessertItem) {
        dessertPrepEvents.push(...events);
      } else {
        mainEvents.push(...events);
      }
    }

    // Post-serve steps (dessert baking)
    if (postSteps.length > 0) {
      hasPostServe = true;
      const offsets = calcItemOffsets(postSteps);
      offsets.forEach(step => {
        postServeEvents.push({
          id: `${meta.id}_${step._origIdx}`, ...meta,
          stepName: step.name, note: step.note, type: step.type,
          autoPause: step.auto, isBg: !!step.bg, temp: step.temp, isPostServe: true,
          offsetStart: step.calcStart, offsetEnd: step.calcEnd,
          durMins: step.dur,
        });
      });
    }
  }

  mainEvents.sort((a, b) => a.offsetStart - b.offsetStart);
  postServeEvents.sort((a, b) => a.offsetStart - b.offsetStart);

  // Shift dessert prep to happen BEFORE the main cooking phase
  if (dessertPrepEvents.length > 0) {
    dessertPrepEvents.sort((a, b) => a.offsetStart - b.offsetStart);
    const earliestMain = mainEvents.length > 0 ? mainEvents[0].offsetStart : 0;
    // Dessert prep ends where main cooking begins
    const dessertPrepDuration = -(dessertPrepEvents[0].offsetStart); // total span
    const dessertShift = earliestMain - dessertPrepDuration;
    dessertPrepEvents.forEach(e => {
      // Shift: dessert offsets are already negative (e.g. -16 to 0), 
      // add dessertShift to push them earlier
      e.offsetStart += dessertShift;
      e.offsetEnd += dessertShift;
    });
  }

  // Combine: dessert prep → START COOKING → mains → SERVE → post-serve → DESSERT READY
  const combined = [];

  if (dessertPrepEvents.length > 0) {
    combined.push(...dessertPrepEvents);
    const mainStart = mainEvents.length > 0 ? mainEvents[0].offsetStart : 0;
    combined.push({
      id: "_dessert_prepped", stepName: "✅ DESSERT PREPPED", note: "Set aside and ready for the oven later. Now let's cook the roast!",
      type: "action", autoPause: true, isBg: false, isServeMarker: true, colour: "#c47a4c",
      itemName: "", itemIcon: "✅", offsetStart: mainStart, offsetEnd: mainStart, durMins: 0,
    });
  }

  combined.push(...mainEvents);

  combined.push({
    id: "_serve_mains", stepName: "🍽️ SERVE MAINS!", 
    note: hasPostServe ? "Get dessert in the oven, sit down, and enjoy your roast." : "Sit down and enjoy your roast dinner!",
    type: "action", autoPause: true, isBg: false, isServeMarker: true, colour: "#d4883c",
    itemName: "", itemIcon: "🍽️", offsetStart: 0, offsetEnd: 0, durMins: 0,
  });

  if (hasPostServe) {
    combined.push(...postServeEvents);
    const lastPost = postServeEvents[postServeEvents.length - 1];
    const dessertReady = lastPost ? lastPost.offsetEnd : 0;
    combined.push({
      id: "_serve_dessert", stepName: "🍰 DESSERT IS READY!", note: "Take it out, plate up, and enjoy!",
      type: "action", autoPause: true, isBg: false, isServeMarker: true, colour: "#c47a4c",
      itemName: "", itemIcon: "🍰", offsetStart: dessertReady, offsetEnd: dessertReady, durMins: 0,
    });
  }

  return combined.map(e => ({
    ...e,
    absStart: new Date(servingTimeMs + e.offsetStart * 60000),
    absEnd: new Date(servingTimeMs + e.offsetEnd * 60000),
  }));
}
// ─── UTILITIES ──────────────────────────────────────────────────────────

function fmt(d) {
  return d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", hour12: false });
}

function fmtCountdown(ms) {
  if (ms <= 0) return "00:00";
  const totalSec = Math.ceil(ms / 1000);
  const h = Math.floor(totalSec / 3600);
  const m = Math.floor((totalSec % 3600) / 60);
  const s = totalSec % 60;
  if (h > 0) return `${h}:${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
  return `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
}

function fmtDuration(mins) {
  if (mins < 60) return `${mins} min`;
  const h = Math.floor(mins / 60);
  const m = mins % 60;
  return m > 0 ? `${h}h ${m}m` : `${h}h`;
}

// ─── MAIN APP ───────────────────────────────────────────────────────────

function RoastTimer() {
  const [screen, setScreen] = useState("select");
  const [selected, setSelected] = useState(new Set());
  const [itemWeights, setItemWeights] = useState({});
  const [serveHour, setServeHour] = useState(() => {
    const now = new Date();
    const h = now.getHours();
    return h < 10 ? 13 : h < 15 ? h + 3 : h + 2;
  });
  const [serveMin, setServeMin] = useState(0);
  const [timeline, setTimeline] = useState([]);
  const [cookState, setCookState] = useState({ completed: new Set(), skipped: new Set(), manualPause: false });
  const [now, setNow] = useState(Date.now());
  const timerRef = useRef(null);
  const wakeLockRef = useRef(null);

  // ── Single-source item store ──
  // On first load, seed with all built-in recipes. After that, store IS the data.
  const STORE_VERSION = 2;
  const [store, setStore] = useState(() => {
    try {
      const s = JSON.parse(localStorage.getItem("roast_data"));
      if (s && s.v === STORE_VERSION) return s;
    } catch {}
    // Seed: copy all SIDES into store with category field
    const seeded = {};
    for (const cat of CATEGORIES) {
      for (const entry of cat.items) {
        if (SIDES[entry.id]) {
          seeded[entry.id] = { ...SIDES[entry.id], category: cat.key };
        }
      }
    }
    return { v: STORE_VERSION, items: seeded, categories: [] };
  });
  const [editingItem, setEditingItem] = useState(null);
  const [dragIdx, setDragIdx] = useState(null);

  const storeItems = store.items;
  const customCategories = store.categories;

  // Persist
  useEffect(() => {
    try { localStorage.setItem("roast_data", JSON.stringify(store)); } catch {}
  }, [store]);

  // All category definitions (built-in + custom)
  const allCategories = useMemo(() => [
    ...CATEGORIES.map(c => ({ key: c.key, label: c.label })),
    ...customCategories.map(c => ({ key: c.key, label: c.label, isCustom: true })),
  ], [customCategories]);

  // Build display categories from store items
  const mergedCategories = useMemo(() => {
    const cats = allCategories.map(c => ({ ...c, items: [] }));
    Object.entries(storeItems).forEach(([id, item]) => {
      const cat = cats.find(c => c.key === item.category);
      if (cat) cat.items.push({ id, label: item.name, icon: item.icon, colour: item.colour });
    });
    return cats.filter(c => c.items.length > 0);
  }, [allCategories, storeItems]);

  // Long press handler
  const longPressRef = useRef(null);
  const lastTapRef = useRef({ id: null, time: 0 });

  const openEditor = (itemId) => {
    const item = storeItems[itemId];
    if (item) {
      setEditingItem({ id: itemId, ...item, steps: item.steps.map((st,i) => ({ ...st, _key: i })), isNew: false });
      setScreen("edit");
    }
  };

  const startLongPress = (itemId) => {
    longPressRef.current = setTimeout(() => {
      longPressRef.current = "fired";
      openEditor(itemId);
    }, 600);
  };
  const endLongPress = () => {
    if (longPressRef.current && longPressRef.current !== "fired") {
      clearTimeout(longPressRef.current);
    }
    longPressRef.current = null;
  };
  const handleTap = (itemId) => {
    if (longPressRef.current === "fired") return; // was long press
    const now = Date.now();
    if (lastTapRef.current.id === itemId && now - lastTapRef.current.time < 350) {
      // Double tap → edit
      lastTapRef.current = { id: null, time: 0 };
      openEditor(itemId);
    } else {
      // Single tap → toggle
      lastTapRef.current = { id: itemId, time: now };
      toggle(itemId);
    }
  };

  const createNewItem = () => {
    const id = "custom_" + Date.now();
    setEditingItem({
      id, name: "", icon: "🍽️", colour: "#d4883c", category: "sides",
      steps: [], isNew: true,
    });
    setScreen("edit");
  };

  const saveEditingItem = () => {
    if (!editingItem || !editingItem.name.trim()) return;
    const { id, isNew, ...data } = editingItem;
    const clean = { ...data, steps: data.steps.map(({ _key, ...rest }) => rest) };
    setStore(prev => ({ ...prev, items: { ...prev.items, [id]: clean } }));
    setEditingItem(null);
    setScreen("select");
  };

  const deleteEditingItem = () => {
    if (!editingItem) return;
    const id = editingItem.id;
    setStore(prev => {
      const items = { ...prev.items };
      delete items[id];
      return { ...prev, items };
    });
    setSelected(prev => { const n = new Set(prev); n.delete(id); return n; });
    setEditingItem(null);
    setScreen("select");
  };

  const saveAsNew = () => {
    if (!editingItem || !editingItem.name.trim()) return;
    const newId = "custom_" + Date.now();
    const { id, isNew, ...data } = editingItem;
    const clean = { ...data, steps: data.steps.map(({ _key, ...rest }) => rest) };
    setStore(prev => ({ ...prev, items: { ...prev.items, [newId]: clean } }));
    setEditingItem(null);
    setScreen("select");
  };

  const weightBasedItems = useMemo(() => {
    return [...selected].filter(s => {
      const item = storeItems[s];
      return item && item.weightBased;
    }).map(s => {
      const item = storeItems[s];
      return { id: s, name: item.name, icon: item.icon };
    });
  }, [selected, storeItems]);
  const getWeight = (id) => itemWeights[id] || 1500;
  const setWeight = (id, w) => setItemWeights(prev => ({ ...prev, [id]: w }));

  const servingTime = useMemo(() => {
    const d = new Date();
    d.setHours(serveHour % 24, serveMin, 0, 0);
    if (d.getTime() < Date.now()) d.setDate(d.getDate() + 1);
    return d.getTime();
  }, [serveHour, serveMin]);

  const computedTimeline = useMemo(() => {
    if (selected.size === 0) return [];
    return generateTimeline([...selected], itemWeights, servingTime, storeItems);
  }, [selected, itemWeights, servingTime, storeItems]);

  const startTime = computedTimeline.length > 0 ? computedTimeline[0].absStart : null;
  const totalMinsBefore = computedTimeline.length > 0 ? -computedTimeline[0].offsetStart : 0;
  const lastEvent = computedTimeline.length > 0 ? computedTimeline[computedTimeline.length - 1] : null;
  const hasDessertPhase = computedTimeline.some(e => e.isPostServe);

  // Timer tick
  useEffect(() => {
    if (screen === "cook" && !cookState.manualPause) {
      timerRef.current = setInterval(() => setNow(Date.now()), 250);
      return () => clearInterval(timerRef.current);
    }
    return () => clearInterval(timerRef.current);
  }, [screen, cookState.manualPause]);

  // Wake lock
  useEffect(() => {
    if (screen === "cook" && navigator.wakeLock) {
      navigator.wakeLock.request("screen").then(l => { wakeLockRef.current = l; }).catch(() => {});
      return () => { wakeLockRef.current?.release(); };
    }
  }, [screen]);

  // Alert when a new step's time arrives
  const lastAlertedRef = useRef(-1);
  useEffect(() => {
    if (screen !== "cook") return;
    // Find first uncompleted/unskipped step whose time has arrived
    const activeIdx = timeline.findIndex((ev, i) =>
      !cookState.completed.has(i) && !cookState.skipped.has(i) && ev.absStart.getTime() <= now
    );
    if (activeIdx >= 0 && activeIdx !== lastAlertedRef.current) {
      lastAlertedRef.current = activeIdx;
      if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
    }
  }, [now, screen, timeline, cookState.completed, cookState.skipped]);

  const toggle = (id) => {
    setSelected(prev => {
      const next = new Set(prev);
      // Yorkshire mutual exclusion
      if (id === "yorkshires_big") next.delete("yorkshires_small");
      if (id === "yorkshires_small") next.delete("yorkshires_big");
      
      if (next.has(id)) next.delete(id); else next.add(id);
      return next;
    });
  };

  const goToPlan = () => {
    setScreen("plan");
  };

  const startCooking = () => {
    const nowMs = Date.now();
    const firstOffset = computedTimeline[0]?.offsetStart || 0;
    const adjustedServe = nowMs - firstOffset * 60000;
    const tl = generateTimeline([...selected], itemWeights, adjustedServe, storeItems);
    setTimeline(tl);
    setCookState({ completed: new Set(), skipped: new Set(), manualPause: false });
    setNow(Date.now());
    setScreen("cook");
  };

  const markStepDone = (idx) => {
    setCookState(prev => {
      const completed = new Set(prev.completed);
      completed.add(idx);
      return { ...prev, completed };
    });
  };

  const skipStep = (idx) => {
    setCookState(prev => {
      const skipped = new Set(prev.skipped);
      skipped.add(idx);
      return { ...prev, skipped };
    });
  };

  const togglePause = () => {
    setCookState(prev => ({ ...prev, manualPause: !prev.manualPause }));
  };

  // ─── SELECTION SCREEN ───────────────────────────────────────────────
  if (screen === "select") {
    return (
      <div style={S.app}>
        <style>{GFONTS}</style>
        <div style={S.container}>
          <div style={S.header}>
            <h1 style={S.title}>🍖 Roast Dinner</h1>
            <p style={S.subtitle}>What's on the menu?</p>
          </div>

          {mergedCategories.map(cat => (
            <div key={cat.key} style={S.catSection}>
              <h2 style={S.catLabel}>{cat.label}</h2>
              <div style={S.grid}>
                {cat.items.map(item => {
                  const id = item.id;
                  const isOn = selected.has(item.id);
                  return (
                    <button key={item.id}
                      onPointerDown={() => startLongPress(item.id)}
                      onPointerUp={() => { endLongPress(); handleTap(item.id); }}
                      onPointerLeave={endLongPress}
                      onContextMenu={e => e.preventDefault()}
                      style={{ ...S.itemCard, ...(isOn ? S.itemCardOn : {}), borderColor: isOn ? (item.colour || storeItems[item.id]?.colour || "#d4883c") : "rgba(255,255,255,0.06)" }}>
                      <span style={S.itemIcon}>{item.icon}</span>
                      <span style={S.itemLabel}>{item.label}</span>
                      {isOn && <span style={S.checkmark}>✓</span>}
                    </button>
                  );
                })}
              </div>
            </div>
          ))}

          {/* Add custom item */}
          <button onClick={createNewItem} style={S.addBtn}>
            + Add custom item
          </button>
          <p style={{ color: C.textMuted, fontSize: 11, textAlign: "center", marginBottom: 16, opacity: 0.6 }}>
            Double-tap or long press any item to edit its recipe
          </p>

          {weightBasedItems.length > 0 && (
            <div style={S.configBox}>
              <label style={S.configLabel}>Weights</label>
              {weightBasedItems.map(wb => (
                <div key={wb.id} style={{ marginBottom: weightBasedItems.length > 1 ? 14 : 0 }}>
                  <div style={{ fontSize: 14, fontWeight: 600, color: C.text, marginBottom: 6 }}>
                    {wb.icon} {wb.name}
                  </div>
                  <div style={S.weightRow}>
                    {[750, 1000, 1500, 2000, 2500, 3000, 4000, 5000].map(w => (
                      <button key={w} onClick={e => { setWeight(wb.id, w); e.target.blur(); }}
                        style={{ ...S.weightBtn, ...(getWeight(wb.id) === w ? S.weightBtnOn : {}) }}>
                        {w >= 1000 ? `${w / 1000}kg` : `${w}g`}
                      </button>
                    ))}
                  </div>
                  <div style={{marginTop: 6, display: 'flex', alignItems: 'center', gap: 8}}>
                    <label style={{...S.configLabel, margin:0, fontSize: 12}}>Custom (g):</label>
                    <input type="number" value={getWeight(wb.id)} onChange={e => setWeight(wb.id, +e.target.value || 0)}
                      onBlur={e => { if (getWeight(wb.id) < 100) setWeight(wb.id, 100); }}
                      style={S.numInput} />
                  </div>
                </div>
              ))}
            </div>
          )}

          <div style={S.configBox}>
            <label style={S.configLabel}>Serving time</label>
            <div style={S.timeRow}>
              <button onClick={() => setServeHour(h => (h - 1 + 24) % 24)} style={S.timeBtn}>◂</button>
              <span style={S.timeDisplay}>{String(serveHour).padStart(2, "0")}:{String(serveMin).padStart(2, "0")}</span>
              <button onClick={() => setServeHour(h => (h + 1) % 24)} style={S.timeBtn}>▸</button>
              <span style={{width: 16}} />
              <button onClick={() => setServeMin(m => (m - 15 + 60) % 60)} style={S.timeBtn}>◂</button>
              <span style={S.timeSub}>mins</span>
              <button onClick={() => setServeMin(m => (m + 15) % 60)} style={S.timeBtn}>▸</button>
            </div>
          </div>

          <button onClick={goToPlan} disabled={selected.size === 0}
            style={{ ...S.bigBtn, opacity: selected.size === 0 ? 0.3 : 1 }}>
            Plan it → {selected.size > 0 && `(${selected.size} items)`}
          </button>
        </div>
      </div>
    );
  }

  // ─── EDIT SCREEN ──────────────────────────────────────────────────
  if (screen === "edit" && editingItem) {
    const ei = editingItem;
    const updateEI = (patch) => setEditingItem(prev => ({ ...prev, ...patch }));
    const updateStep = (idx, patch) => {
      const steps = [...ei.steps];
      steps[idx] = { ...steps[idx], ...patch };
      updateEI({ steps });
    };
    const addStep = () => {
      updateEI({ steps: [...ei.steps, { name: "", dur: 5, type: "cook", auto: false, bg: false, waitBg: false, note: "", _key: Date.now() }] });
    };
    const removeStep = (idx) => {
      updateEI({ steps: ei.steps.filter((_, i) => i !== idx) });
    };
    const moveStep = (from, to) => {
      if (to < 0 || to >= ei.steps.length) return;
      const steps = [...ei.steps];
      const [moved] = steps.splice(from, 1);
      steps.splice(to, 0, moved);
      updateEI({ steps });
      setDragIdx(to);
    };

    const EMOJIS = ["🍽️","🥘","🫕","🥗","🍲","🥧","🧆","🥙","🌮","🫔","🥪","🧇","🥞","🍕","🫠","🥐","🍗","🥩","🐟","🦐","🧈","🥚","🫘","🍄","🌶️","🧄","🧅","🌽","🥦","🫑","🥕","🥔","🍠","🥬","🫛","🌰","🧀","🍏","🍋","🫐","🍞","🥖","🍰","🍮","🫗","🌭","🍺","☕"];
    const COLOURS = ["#c45c4c","#d4883c","#e08c4a","#d4b44c","#d4c040","#c9a060","#cc7a3e","#8cb369","#6b9e6b","#5a8c5a","#7a9e6b","#b8860b","#8b7355","#8b6f47","#6b4423","#b85c4c","#d4c090","#c9a84c"];

    return (
      <div style={S.app}>
        <style>{GFONTS}</style>
        <div style={S.container}>
          <button onClick={() => { setEditingItem(null); setScreen("select"); }} style={S.backBtn}>← Cancel</button>
          <div style={S.header}>
            <h1 style={S.title}>{ei.isNew ? "New Item" : "Edit Item"}</h1>
          </div>

          {/* Name & Icon */}
          <div style={S.configBox}>
            <label style={S.configLabel}>Name</label>
            <input type="text" value={ei.name} onChange={e => updateEI({ name: e.target.value })}
              placeholder="e.g. Honey-Glazed Parsnips"
              style={S.editInput} />
          </div>

          <div style={S.configBox}>
            <label style={S.configLabel}>Icon</label>
            <div style={S.emojiGrid}>
              {EMOJIS.map(em => (
                <button key={em} onClick={() => updateEI({ icon: em })}
                  style={{ ...S.emojiBtn, ...(ei.icon === em ? { background: "rgba(255,255,255,0.15)", transform: "scale(1.2)" } : {}) }}>
                  {em}
                </button>
              ))}
            </div>
          </div>

          <div style={S.configBox}>
            <label style={S.configLabel}>Colour</label>
            <div style={S.colourGrid}>
              {COLOURS.map(c => (
                <button key={c} onClick={() => updateEI({ colour: c })}
                  style={{ ...S.colourBtn, background: c, ...(ei.colour === c ? { outline: "2px solid #fff", outlineOffset: 2, transform: "scale(1.15)" } : {}) }} />
              ))}
            </div>
          </div>

          <div style={S.configBox}>
            <label style={S.configLabel}>Category</label>
            <div style={S.weightRow}>
              {allCategories.map(c => (
                <button key={c.key} onClick={() => updateEI({ category: c.key })}
                  style={{ ...S.weightBtn, ...(ei.category === c.key ? S.weightBtnOn : {}) }}>
                  {c.label}
                </button>
              ))}
              {ei.addingCategory ? (
                <input type="text" autoFocus placeholder="Category name..."
                  onKeyDown={e => {
                    if (e.key === "Enter" && e.target.value.trim()) {
                      const name = e.target.value.trim();
                      const key = "cat_" + name.toLowerCase().replace(/\s+/g, "_");
                      if (!allCategories.find(c => c.key === key)) {
                        setStore(prev => ({ ...prev, categories: [...prev.categories, { key, label: name }] }));
                      }
                      updateEI({ category: key, addingCategory: false });
                    } else if (e.key === "Escape") {
                      updateEI({ addingCategory: false });
                    }
                  }}
                  onBlur={e => {
                    const name = e.target.value.trim();
                    if (name) {
                      const key = "cat_" + name.toLowerCase().replace(/\s+/g, "_");
                      if (!allCategories.find(c => c.key === key)) {
                        setStore(prev => ({ ...prev, categories: [...prev.categories, { key, label: name }] }));
                      }
                      updateEI({ category: key, addingCategory: false });
                    } else {
                      updateEI({ addingCategory: false });
                    }
                  }}
                  style={{ ...S.editInput, width: 120, padding: "8px 10px", fontSize: 13 }} />
              ) : (
                <button onClick={() => updateEI({ addingCategory: true })}
                  style={{ ...S.weightBtn, color: C.accent, borderColor: C.accent + "44" }}>
                  + Add
                </button>
              )}
            </div>
          </div>

          <div style={S.configBox}>
            <label style={S.flagLabel}>
              <input type="checkbox" checked={!!ei.weightBased} onChange={e => updateEI({ weightBased: e.target.checked })} />
              <span style={S.configLabel}>Weight-based timing (cook X + X per kg)</span>
            </label>
          </div>

          {/* Steps editor */}
          <div style={{ ...S.configBox, padding: "18px 12px" }}>
            <label style={S.configLabel}>Cooking Steps</label>
            {ei.steps.map((step, idx) => (
              <div key={step._key || idx}
                draggable
                onDragStart={() => setDragIdx(idx)}
                onDragOver={e => { e.preventDefault(); if (dragIdx !== null && dragIdx !== idx) moveStep(dragIdx, idx); }}
                onDragEnd={() => setDragIdx(null)}
                style={{ ...S.stepCard, ...(dragIdx === idx ? { opacity: 0.6, border: `2px dashed ${C.accent}` } : {}) }}>
                {/* Drag handle + step number */}
                <div style={S.stepTopRow}>
                  <span style={S.dragHandle} onTouchStart={() => setDragIdx(idx)}>⠿</span>
                  <span style={S.stepNum}>Step {idx + 1}</span>
                  <button onClick={() => removeStep(idx)} style={S.stepDeleteBtn}>✕</button>
                </div>

                {/* Step name */}
                <input type="text" value={step.name} onChange={e => updateStep(idx, { name: e.target.value })}
                  placeholder="Step name" style={{ ...S.editInput, marginBottom: 8 }} />

                {/* Type + Duration row */}
                <div style={S.stepRow}>
                  <select value={step.type} onChange={e => updateStep(idx, { type: e.target.value })}
                    style={S.editSelect}>
                    <option value="prep">🔪 Prep</option>
                    <option value="heat">🔥 Heat</option>
                    <option value="cook">⏲️ Cook</option>
                    <option value="action">👋 Action</option>
                    <option value="rest">😴 Rest</option>
                  </select>
                  <div style={S.durRow}>
                    <button onClick={() => updateStep(idx, { dur: Math.max(0, step.dur - 1) })} style={S.durBtn}>−</button>
                    <input type="number" value={step.dur} onChange={e => updateStep(idx, { dur: Math.max(0, +e.target.value || 0) })}
                      style={S.durInput} />
                    <button onClick={() => updateStep(idx, { dur: step.dur + 1 })} style={S.durBtn}>+</button>
                    <span style={S.durLabel}>min</span>
                  </div>
                  {/* Temperature for heat/cook */}
                  {(step.type === "heat" || step.type === "cook") && (
                    <div style={S.durRow}>
                      <input type="number" value={step.temp || ""} onChange={e => updateStep(idx, { temp: +e.target.value || 0 })}
                        placeholder="°C" style={{ ...S.durInput, width: 55 }} />
                      <span style={S.durLabel}>°C</span>
                    </div>
                  )}
                </div>

                {/* Per kg (for weight-based items, cook steps only) */}
                {ei.weightBased && step.type === "cook" && (
                  <div style={{ ...S.stepRow, marginBottom: 8 }}>
                    <span style={{ fontSize: 12, color: C.textMuted }}>Extra per kg:</span>
                    <div style={S.durRow}>
                      <input type="number" value={step.perKg || 0} onChange={e => updateStep(idx, { perKg: Math.max(0, +e.target.value || 0) })}
                        style={{ ...S.durInput, width: 55 }} />
                      <span style={S.durLabel}>min/kg</span>
                    </div>
                  </div>
                )}

                {/* Flags */}
                <div style={S.stepFlags}>
                  <label style={S.flagLabel}>
                    <input type="checkbox" checked={!!step.bg} onChange={e => updateStep(idx, { bg: e.target.checked })} />
                    <span>Hands free</span>
                  </label>
                  <label style={S.flagLabel}>
                    <input type="checkbox" checked={!!step.waitBg} onChange={e => updateStep(idx, { waitBg: e.target.checked })} />
                    <span>Wait for prev</span>
                  </label>
                  <label style={S.flagLabel}>
                    <input type="checkbox" checked={!!step.auto} onChange={e => updateStep(idx, { auto: e.target.checked })} />
                    <span>Auto-pause</span>
                  </label>
                  <label style={S.flagLabel}>
                    <input type="checkbox" checked={!!step.afterServe} onChange={e => updateStep(idx, { afterServe: e.target.checked })} />
                    <span>After mains</span>
                  </label>
                </div>

                {/* Note */}
                <textarea value={step.note || ""} onChange={e => updateStep(idx, { note: e.target.value })}
                  placeholder="Instructions / notes..." rows={2}
                  style={S.editTextarea} />
              </div>
            ))}

            <button onClick={addStep} style={S.addStepBtn}>+ Add step</button>
          </div>

          {/* Save / Save as New / Delete */}
          <div style={S.actionRow}>
            <button onClick={saveEditingItem} disabled={!ei.name.trim() || ei.steps.length === 0}
              style={{ ...S.doneBtn, flex: 1, opacity: (!ei.name.trim() || ei.steps.length === 0) ? 0.4 : 1 }}>
              ✓ Save
            </button>
            {!ei.isNew && (
              <button onClick={saveAsNew} disabled={!ei.name.trim() || ei.steps.length === 0}
                style={{ ...S.pauseBtn, flex: 1, opacity: (!ei.name.trim() || ei.steps.length === 0) ? 0.4 : 1 }}>
                Save as New
              </button>
            )}
          </div>
          {!ei.isNew && !ei.confirmDelete && (
            <button onClick={() => updateEI({ confirmDelete: true })}
              style={S.deleteBtn}>
              Delete item
            </button>
          )}
          {ei.confirmDelete && (
            <div style={{ ...S.actionRow, marginTop: 12 }}>
              <button onClick={deleteEditingItem}
                style={{ ...S.deleteBtn, flex: 1, background: C.danger, color: "#fff", border: "none" }}>
                Yes, delete
              </button>
              <button onClick={() => updateEI({ confirmDelete: false })}
                style={{ ...S.skipBtn, flex: 1 }}>
                Cancel
              </button>
            </div>
          )}
        </div>
      </div>
    );
  }

  // ─── PLAN SCREEN ────────────────────────────────────────────────────
  if (screen === "plan") {
    return (
      <div style={S.app}>
        <style>{GFONTS}</style>
        <div style={S.container}>
          <button onClick={() => setScreen("select")} style={S.backBtn}>← Change menu</button>
          <div style={S.header}>
            <h1 style={S.title}>📋 The Plan</h1>
            <div style={S.planSummary}>
              <div style={S.planStat}>
                <span style={S.planStatLabel}>Start at</span>
                <span style={S.planStatVal}>{startTime ? fmt(startTime) : "—"}</span>
              </div>
              <div style={S.planStat}>
                <span style={S.planStatLabel}>Serve mains</span>
                <span style={S.planStatVal}>{String(serveHour).padStart(2,"0")}:{String(serveMin).padStart(2,"0")}</span>
              </div>
              <div style={S.planStat}>
                <span style={S.planStatLabel}>Cook time</span>
                <span style={S.planStatVal}>{fmtDuration(totalMinsBefore)}</span>
              </div>
              {hasDessertPhase && lastEvent ? (
                <div style={S.planStat}>
                  <span style={S.planStatLabel}>Dessert ready</span>
                  <span style={{ ...S.planStatVal, color: "#c47a4c" }}>{fmt(lastEvent.absStart)}</span>
                </div>
              ) : (
                <div style={S.planStat}>
                  <span style={S.planStatLabel}>Steps</span>
                  <span style={S.planStatVal}>{computedTimeline.length}</span>
                </div>
              )}
            </div>
          </div>

          <div style={S.timeline}>
            {computedTimeline.map((ev, i) => (
              <div key={ev.id} style={S.tlItem}>
                <div style={S.tlTime}>{fmt(ev.absStart)}</div>
                <div style={{ ...S.tlDot, background: ev.colour, ...(ev.isServeMarker ? { width: 18, height: 18 } : {}) }} />
                <div style={S.tlContent}>
                  {ev.isServeMarker ? (
                    <>
                      <div style={{ fontSize: 18, fontWeight: 700, color: ev.colour }}>{ev.stepName}</div>
                      <div style={S.tlNote}>{ev.note}</div>
                    </>
                  ) : (
                    <>
                      <div style={S.tlHeader}>
                        <span style={S.tlItemName}>{ev.itemIcon} {ev.itemName}</span>
                        <span style={{display:'flex',gap:4}}>
                          {ev.isPostServe && <span style={{ ...S.bgBadge, background: "#c47a4c33", color: "#c47a4c" }}>AFTER MAINS</span>}
                          {ev.isBg && ev.durMins > 0 && <span style={S.bgBadge}>HANDS FREE</span>}
                          {ev.autoPause && <span style={S.pauseBadge}>⏸ PAUSE</span>}
                        </span>
                      </div>
                      <div style={S.tlStep}>{ev.stepName}</div>
                      {ev.durMins > 0 && <div style={S.tlDur}>{fmtDuration(ev.durMins)}</div>}
                      <div style={S.tlNote}>{ev.note}</div>
                    </>
                  )}
                </div>
              </div>
            ))}
          </div>

          <button onClick={startCooking} style={S.goBtn}>
            🔥 GO! Start Cooking
          </button>
        </div>
      </div>
    );
  }

  // ─── COOK SCREEN ────────────────────────────────────────────────────
  if (screen === "cook") {
    // Derive state from timeline + completed/skipped sets
    const remaining = timeline.map((ev, i) => ({ ev, i }))
      .filter(({ i }) => !cookState.completed.has(i) && !cookState.skipped.has(i));

    const activeEntry = remaining.find(({ ev }) => ev.absStart.getTime() <= now);
    const isAllDone = remaining.length === 0;
    const isWaiting = !activeEntry && !isAllDone;
    const nextEntry = remaining[0];

    // In-progress: completed bg steps still running
    const inProgress = timeline.filter((ev, i) =>
      (cookState.completed.has(i) || cookState.skipped.has(i)) &&
      ev.isBg && ev.durMins > 0 && ev.absEnd.getTime() > now
    );

    // Coming up: remaining steps AFTER the active one
    const upcomingSteps = activeEntry
      ? remaining.filter(({ i }) => i > activeEntry.i).slice(0, 5)
      : remaining.slice(0, 5);

    // Total progress
    const totalSteps = timeline.length;
    const doneCount = cookState.completed.size + cookState.skipped.size;

    if (isAllDone) {
      return (
        <div style={S.app}>
          <style>{GFONTS}</style>
          <div style={S.cookContainer}>
            <div style={S.doneScreen}>
              <div style={{ fontSize: 80 }}>🍽️</div>
              <h1 style={{ ...S.title, color: "#d4883c", marginTop: 16 }}>Dinner is served!</h1>
              <p style={S.subtitle}>Now sit down and enjoy it. You've earned this.</p>
              <button onClick={() => setScreen("select")} style={S.bigBtn}>Cook again</button>
            </div>
          </div>
        </div>
      );
    }

    return (
      <div style={S.app}>
        <style>{GFONTS}</style>
        <div style={S.cookContainer}>
          {/* Top bar */}
          <div style={S.cookTopBar}>
            <button onClick={() => setScreen("select")} style={S.cookBackBtn}>✕</button>
            <div style={S.cookProgress}>
              {doneCount} / {totalSteps} done
            </div>
            <div style={S.cookClock}>{fmt(new Date(now))}</div>
          </div>

          {/* ── WAITING STATE ── */}
          {isWaiting && nextEntry && (
            <>
              <div style={S.waitingCard}>
                <div style={S.waitingIcon}>☕</div>
                <div style={S.waitingLabel}>Next step in</div>
                <div style={S.waitingTimer}>
                  {fmtCountdown(nextEntry.ev.absStart.getTime() - now)}
                </div>
                <div style={S.waitingPreview}>
                  <span style={{ fontSize: 20, marginRight: 8 }}>{nextEntry.ev.itemIcon}</span>
                  <div>
                    <div style={{ fontSize: 13, color: C.textMuted, fontWeight: 600, textTransform: "uppercase", letterSpacing: 1 }}>
                      {nextEntry.ev.itemName}
                    </div>
                    <div style={{ fontSize: 16, fontWeight: 600, color: C.text, marginTop: 2 }}>
                      {nextEntry.ev.stepName}
                    </div>
                    <div style={{ fontSize: 13, color: C.textMuted, marginTop: 4, lineHeight: 1.4 }}>
                      {nextEntry.ev.note}
                    </div>
                  </div>
                </div>
                <div style={{ fontSize: 12, color: C.textMuted, marginTop: 12 }}>
                  at {fmt(nextEntry.ev.absStart)}
                </div>
              </div>
              <div style={S.actionRow}>
                <button onClick={() => skipStep(nextEntry.i)} style={S.skipBtn}>
                  Skip this →
                </button>
              </div>
            </>
          )}

          {/* ── ACTIVE STEP ── */}
          {activeEntry && (() => {
            const current = activeEntry.ev;
            const idx = activeEntry.i;
            let countdown = 0;
            let progress = 0;
            if (current.durMins > 0) {
              const elapsed = now - current.absStart.getTime();
              const total = current.durMins * 60000;
              countdown = Math.max(0, total - elapsed);
              progress = Math.min(1, elapsed / total);
            }
            const timerDone = current.durMins > 0 && countdown <= 0;

            return (
              <>
                <div style={{ ...S.currentStep, borderLeftColor: current.colour }}>
                  <div style={S.currentItemRow}>
                    <span style={{ fontSize: 28 }}>{current.itemIcon}</span>
                    <span style={S.currentItemName}>{current.itemName}</span>
                    <span style={{ ...S.typeBadge, background: current.colour + "33", color: current.colour }}>
                      {TYPE_ICONS[current.type]} {TYPE_LABELS[current.type]}
                    </span>
                  </div>
                  <h2 style={S.currentStepName}>{current.stepName}</h2>
                  <p style={S.currentNote}>{current.note}</p>

                  {current.durMins > 0 && (
                    <div style={S.timerSection}>
                      <div style={S.progressBar}>
                        <div style={{ ...S.progressFill, width: `${progress * 100}%`, background: timerDone ? C.success : current.colour }} />
                      </div>
                      <div style={{ ...S.timerDisplay, color: timerDone ? C.success : C.accent }}>
                        {timerDone ? "✓ TIME" : fmtCountdown(countdown)}
                      </div>
                      <div style={S.timerLabel}>{fmtDuration(current.durMins)} total</div>
                    </div>
                  )}
                </div>

                {/* Action buttons */}
                <div style={S.actionRow}>
                  <button onClick={() => markStepDone(idx)} style={S.doneBtn}>
                    ✓ Done
                  </button>
                  <button onClick={() => skipStep(idx)} style={S.skipBtn}>
                    Skip →
                  </button>
                </div>
              </>
            );
          })()}

          {/* ── IN PROGRESS ── */}
          {inProgress.length > 0 && (
            <div style={S.bgSection}>
              <h3 style={S.bgTitle}>🔥 In progress</h3>
              {inProgress.map(ev => {
                const remaining = Math.max(0, ev.absEnd.getTime() - now);
                const done = remaining <= 0;
                return (
                  <div key={ev.id} style={{ ...S.bgItem, borderLeftColor: ev.colour }}>
                    <span>{ev.itemIcon} {ev.stepName}</span>
                    <span style={{ ...S.bgTimer, color: done ? C.success : C.accent }}>
                      {done ? "✓ Done" : fmtCountdown(remaining)}
                    </span>
                  </div>
                );
              })}
            </div>
          )}

          {/* ── COMING UP ── */}
          {upcomingSteps.length > 0 && (
            <div style={S.upSection}>
              <h3 style={S.bgTitle}>Coming up</h3>
              {upcomingSteps.map(({ ev, i }) => {
                const timeUntil = ev.absStart.getTime() - now;
                const isReady = timeUntil <= 0;
                return (
                  <div key={ev.id} style={{ ...S.upItem, borderLeftColor: ev.colour }}>
                    <div style={S.upItemTop}>
                      <span>{ev.itemIcon} {ev.itemName}</span>
                      <span style={{ ...S.upTime, color: isReady ? C.success : C.accent }}>
                        {isReady ? "ready now" : `in ${fmtCountdown(timeUntil)}`}
                      </span>
                    </div>
                    <div style={S.upStep}>{ev.stepName}</div>
                    <div style={S.upMeta}>
                      <span style={S.upAt}>{fmt(ev.absStart)}</span>
                      {ev.durMins > 0 && <span style={S.upDur}>{fmtDuration(ev.durMins)}</span>}
                      {ev.autoPause && <span style={{ ...S.pauseBadge, fontSize: 10 }}>⏸</span>}
                      {ev.isBg && ev.durMins > 0 && <span style={{ ...S.bgBadge, fontSize: 10 }}>HANDS FREE</span>}
                    </div>
                  </div>
                );
              })}
            </div>
          )}
        </div>
      </div>
    );
  }

  return null;
}

// ─── STYLES ─────────────────────────────────────────────────────────────
const GFONTS = `@import url('https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap');
button:focus, button:focus-visible { outline: none !important; box-shadow: none !important; -webkit-tap-highlight-color: transparent; }
input:focus { outline: none; }
`;

const C = {
  bg: "#1a1614",
  card: "#252018",
  cardHover: "#302820",
  accent: "#d4883c",
  accentLight: "#e8a85c",
  text: "#f0e6d8",
  textMuted: "#a09484",
  border: "rgba(255,255,255,0.06)",
  success: "#6b9e6b",
  danger: "#c45c4c",
};

const S = {
  app: {
    background: C.bg, minHeight: "100vh", color: C.text,
    fontFamily: "'DM Sans', sans-serif", fontSize: 15,
    WebkitFontSmoothing: "antialiased",
  },
  container: {
    maxWidth: 600, margin: "0 auto", padding: "20px 16px 100px",
  },
  cookContainer: {
    maxWidth: 600, margin: "0 auto", padding: "12px 16px 100px",
  },
  header: { textAlign: "center", marginBottom: 28 },
  title: {
    fontFamily: "'Libre Baskerville', serif", fontSize: 28, fontWeight: 700,
    color: C.text, margin: "0 0 4px",
  },
  subtitle: {
    color: C.textMuted, fontSize: 15, margin: 0, fontStyle: "italic",
    fontFamily: "'Libre Baskerville', serif",
  },
  catSection: { marginBottom: 24 },
  catLabel: {
    fontFamily: "'DM Sans', sans-serif", fontSize: 12, fontWeight: 700,
    color: C.textMuted, textTransform: "uppercase", letterSpacing: 2,
    marginBottom: 10, paddingLeft: 2,
  },
  grid: {
    display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(140px, 1fr))", gap: 10,
  },
  itemCard: {
    background: C.card, border: `2px solid ${C.border}`, borderRadius: 12,
    padding: "14px 12px", cursor: "pointer", display: "flex", flexDirection: "column",
    alignItems: "center", gap: 6, transition: "all 0.15s", position: "relative",
    fontFamily: "'DM Sans', sans-serif", color: C.text, fontSize: 13, fontWeight: 500,
  },
  itemCardOn: {
    background: C.cardHover, boxShadow: "0 0 20px rgba(212,136,60,0.15)",
  },
  itemIcon: { fontSize: 28 },
  itemLabel: { textAlign: "center", lineHeight: 1.2 },
  checkmark: {
    position: "absolute", top: 6, right: 8, fontSize: 14,
    color: C.accent, fontWeight: 700,
  },
  configBox: {
    background: C.card, borderRadius: 14, padding: 18, marginBottom: 16,
    border: `1px solid ${C.border}`,
  },
  configLabel: {
    fontSize: 12, fontWeight: 700, color: C.textMuted, textTransform: "uppercase",
    letterSpacing: 2, display: "block", marginBottom: 10,
  },
  weightRow: { display: "flex", flexWrap: "wrap", gap: 8 },
